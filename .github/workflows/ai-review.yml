# Reusable workflow: AI review of a pull request on self-hosted runners.
name: ai-review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: deepseek-v4-flash
      max_chunks:
        type: number
        default: 6
      concurrency:
        type: number
        default: 3
      kit_ref:
        type: string
        default: v1
      kit_repository:
        type: string
        default: your-org/ai-review   # replace <org> with your GHES organization
      runner_labels:
        type: string
        default: '["self-hosted"]'    # JSON array, used via fromJSON
    secrets:
      AI_REVIEW_BOT_PAT:
        required: true
      AI_REVIEW_BOT_NAME:
        required: true
      AI_REVIEW_LLM_API_KEY:
        required: true
      AI_REVIEW_LLM_BASE_URL:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # runner login shell is tcsh

jobs:
  review:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 25
    steps:
      # Note: older GHES versions may require actions/checkout@v3 and
      # actions/upload-artifact@v3; v4 is the default here.
      - name: Checkout target PR head
        uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.AI_REVIEW_BOT_PAT }}

      - name: Checkout review kit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: .ai-review-kit
          persist-credentials: false
          token: ${{ secrets.AI_REVIEW_BOT_PAT }}

      - name: Preflight
        run: |
          claude --version
          python3 --version
          git --version

      - name: Review
        env:
          AI_REVIEW_BOT_PAT: ${{ secrets.AI_REVIEW_BOT_PAT }}
          AI_REVIEW_BOT_NAME: ${{ secrets.AI_REVIEW_BOT_NAME }}
          AI_REVIEW_LLM_API_KEY: ${{ secrets.AI_REVIEW_LLM_API_KEY }}
          AI_REVIEW_LLM_BASE_URL: ${{ secrets.AI_REVIEW_LLM_BASE_URL }}
          AI_REVIEW_MODEL: ${{ inputs.model }}
          GITHUB_API_URL: ${{ github.api_url }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          cd .ai-review-kit
          python3 -E -s -m review --repo "$GITHUB_WORKSPACE/target" \
            --pr "${{ github.event.pull_request.number }}" \
            --set max_chunks="$MAX_CHUNKS" --set concurrency="$CONCURRENCY"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/ai-review/**/stream.jsonl
            ${{ runner.temp }}/ai-review/**/guard-audit.jsonl
            ${{ runner.temp }}/ai-review/review.json
          retention-days: 7
          if-no-files-found: ignore
