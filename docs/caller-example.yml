# Place in the target repo as .github/workflows/ai-review.yml
name: ai-review
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Posting uses the bot PAT (AI_REVIEW_BOT_PAT), so GITHUB_TOKEN only reads.
    permissions:
      contents: read
    uses: your-org/ai-review/.github/workflows/ai-review.yml@v1
    secrets: inherit
